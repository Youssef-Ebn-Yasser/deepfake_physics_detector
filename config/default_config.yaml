dataset:
  root: DataSets
  compression: c40
  real_sources:
  - original_sequences/youtube
  - original_sequences/actors
  fake_sources:
  - manipulated_sequences/Deepfakes
  - manipulated_sequences/Face2Face
  - manipulated_sequences/FaceSwap
  - manipulated_sequences/FaceShifter
  - manipulated_sequences/NeuralTextures
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  features_dir: DataSets/features_v2
preprocessing:
  n_frames: 16
  target_size:
  - 256
  - 256
  gaussian_blur_sigma: 0.8
extractors:
  feature_dim: 64
  motion_blur:
    farneback_iterations: 5
    farneback_winsize: 21
model:
  embed_dim: 256
  master_aux_weight: 0.2
training:
  batch_size: 32
  learning_rate_stage1: 0.001
  learning_rate_stage2: 0.0001
  epochs_stage1: 10
  epochs_stage2: 20
  subsystem_epochs: 20
  subsystem_lr: 0.0001
